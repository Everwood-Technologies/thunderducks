# Thunderducks Pond UI — nginx site (guest)
# Static web client + reverse-proxy to local tducks RPC (loopback only).
#
# Install path (guest bootstrap):
#   /etc/nginx/sites-available/pond-ui.conf
#   ln -sf ... /etc/nginx/sites-enabled/pond-ui.conf
#
# tducks stays on 127.0.0.1:8788. Browser hits :80 only.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/pond;
    index index.html;

    # Long-poll / SSE can idle; avoid premature 60s cuts on wait/stream.
    proxy_connect_timeout 10s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;

    location = /health {
        proxy_pass http://127.0.0.1:8788/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /v1/ {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # SSE / streaming
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Do not expose raw tducks admin port via this vhost.
    # RPC remains loopback; only nginx is LAN-facing.
}
