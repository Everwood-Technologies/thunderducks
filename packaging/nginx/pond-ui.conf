# Thunderducks Pond UI — nginx site (guest)
# Static web client + reverse-proxy to local tducks RPC (loopback only).
#
# Install path (guest bootstrap):
#   /etc/nginx/sites-available/pond-ui.conf
#   ln -sfn ... /etc/nginx/sites-enabled/pond-ui.conf
#   rm -f /etc/nginx/sites-enabled/default
#
# tducks stays on 127.0.0.1:8788. Browser hits :80 only.

upstream tducks_rpc {
    server 127.0.0.1:8788;
    keepalive 8;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/pond;
    index index.html;

    # Long-poll / SSE can idle; avoid premature 60s cuts on wait/stream.
    proxy_connect_timeout 10s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;

    # Exact health — must not fall through to try_files SPA.
    location = /health {
        proxy_pass http://tducks_rpc/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # All RPC under /v1/ (keep request URI).
    location /v1/ {
        proxy_pass http://tducks_rpc;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
