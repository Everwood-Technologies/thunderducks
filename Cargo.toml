[workspace]
resolver = "2"
members = [
  "crates/td-event",
  "crates/td-crypto",
  "crates/td-net",
  "crates/td-node",
  "crates/td-cli",
  "relays/td-relay",
]
default-members = [
  "crates/td-event",
  "crates/td-crypto",
  "crates/td-net",
  "crates/td-node",
  "crates/td-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/Everwood-Technologies/thunderducks"
authors = ["Everwood Technologies"]

[workspace.dependencies]
td-event = { path = "crates/td-event" }
td-crypto = { path = "crates/td-crypto" }
td-net = { path = "crates/td-net" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
blake3 = "1"
ed25519-dalek = { version = "2", features = ["rand_core", "pkcs8", "pem"] }
rand = "0.8"
hex = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "process"] }
bytes = "1"
tracing = "0.1"
vodozemac = "0.10"
clap = { version = "4", features = ["derive", "env"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["cors", "fs"] }
tower = "0.5"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
sha2 = "0.10"
chacha20poly1305 = "0.10"
aead = { version = "0.5", features = ["std"] }
snow = "0.9"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
