name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (e.g. v0.1.0); empty = run id snapshot"
        required: false
        default: ""

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    name: build-${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            cross: false
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            cross: true
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Install cross linker (aarch64)
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build release tducks
        env:
          TARGET: ${{ matrix.target }}
          CROSS: ${{ matrix.cross }}
        run: |
          set -euo pipefail
          if [ "$CROSS" = "true" ]; then
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
            cargo build -p tducks --release --target "$TARGET"
          else
            cargo build -p tducks --release --target "$TARGET"
          fi
          ls -la "target/${TARGET}/release/tducks"

      - name: Package tarball
        id: pack
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            VER="${{ inputs.tag }}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VER="${GITHUB_REF_NAME}"
          else
            VER="snapshot-${GITHUB_RUN_ID}"
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          STAGE="tducks-${VER}-${TARGET}"
          mkdir -p "$STAGE" "$STAGE/packaging/systemd" "$STAGE/scripts"
          cp "target/${TARGET}/release/tducks" "$STAGE/tducks"
          chmod +x "$STAGE/tducks"
          cp README.md LICENSE "$STAGE/" 2>/dev/null || cp README.md "$STAGE/"
          cp packaging/systemd/tducks.service "$STAGE/"
          cp packaging/systemd/tducks.service "$STAGE/packaging/systemd/"
          cp packaging/systemd/tducks-ota-apply.service "$STAGE/packaging/systemd/"
          cp packaging/systemd/tducks-ota-apply.path "$STAGE/packaging/systemd/"
          cp packaging/tducks.env.example "$STAGE/"
          cp scripts/install-tducks.sh "$STAGE/"
          cp scripts/install-tducks.sh "$STAGE/scripts/"
          cp scripts/tducks-ota-apply.sh "$STAGE/"
          cp scripts/tducks-ota-apply.sh "$STAGE/scripts/"
          chmod +x "$STAGE/install-tducks.sh" "$STAGE/tducks-ota-apply.sh" \
            "$STAGE/scripts/install-tducks.sh" "$STAGE/scripts/tducks-ota-apply.sh"
          tar -czf "${STAGE}.tar.gz" "$STAGE"
          # Also flat-friendly name used by install script finder
          echo "asset=${STAGE}.tar.gz" >> "$GITHUB_OUTPUT"
          ls -la "${STAGE}.tar.gz"
          "target/${TARGET}/release/tducks" --help >/dev/null || true
          "target/${TARGET}/release/tducks" version || true

      - uses: actions/upload-artifact@v4
        with:
          name: tducks-${{ matrix.target }}
          path: tducks-*.tar.gz
          if-no-files-found: error

  publish:
    name: publish-release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List assets
        run: find dist -type f -print

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true
          fail_on_unmatched_files: true
          # alpha/beta/rc tags are prereleases (install needs --version; not GitHub "latest")
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          make_latest: ${{ !(contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc')) }}
          body: |
            ## Thunderducks Pond DIY — ${{ github.ref_name }}

            Linux **amd64** + **arm64** node binaries for alpha dogfood (Proxmox VM / bare metal).

            ### Install

            ```bash
            curl -fsSL https://raw.githubusercontent.com/Everwood-Technologies/thunderducks/main/scripts/install-tducks.sh \
              | sudo TDUCKS_VERSION=${{ github.ref_name }} bash
            # or
            sudo ./scripts/install-tducks.sh --version ${{ github.ref_name }}
            ```

            Default RPC: `127.0.0.1:8788`. See `docs/install.md` and `docs/remote-access.md`.

            ### Alpha scope

            - Durable claim/identity (`TD_DATA_DIR`)
            - Recovery login + owner session
            - Tailnet + relay remote path (not open WAN)
            - Olm relay seal v2 + AEAD v1 fallback
            - Noise / QUIC P2P (optional pins + mTLS)
            - OTA apply + single-slot rollback

            ### Not in this alpha

            - macOS / Docker appliance path
            - Signed OTA manifest ceremony (optional pubkey still supported)
            - Multi-version OTA history
            - Retail factory image
