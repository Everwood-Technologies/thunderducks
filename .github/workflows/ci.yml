name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace

  web:
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: clients/web/package-lock.json
      - name: build tducks binary
        run: cargo build -p tducks
      - name: npm ci
        working-directory: clients/web
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: build + smoke
        working-directory: clients/web
        run: npm test

  widgets:
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: build tducks binary
        run: cargo build -p tducks
      - name: widget-sdk test
        working-directory: clients/widget-sdk
        run: npm install && npm test
      - name: bot test
        working-directory: clients/bot
        run: npm test

  harness:
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build relay binary
        run: cargo build -p td-relay --bins
      - name: build P1 examples
        run: cargo build -p td-node --examples
      - name: P1.2 two-user P2P
        run: ./target/debug/examples/two_user_p2p
      - name: P1.3 relay offline catch-up
        run: |
          test -x ./target/debug/td-relay
          TD_RELAY_BIN="$PWD/target/debug/td-relay" ./target/debug/examples/relay_offline_catchup
