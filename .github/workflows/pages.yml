name: pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - "README.md"
      - "SECURITY.md"
      - "LICENSE"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: sync docs into site/
        run: |
          mkdir -p site/docs
          cp docs/*.md site/docs/
          cp README.md site/docs/README.md
          cp SECURITY.md site/docs/SECURITY.md
          cp LICENSE site/docs/LICENSE.txt
      - name: build static site
        run: bash site/build.sh
      - name: upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
